<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlas</title>
    <meta name="description" content="Strength training with a coach that learns from every set." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f0e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1310" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      /* Paint the right background before any CSS loads, so launch never flashes white in dark mode. */
      html { background: #f1f0e9; }
      @media (prefers-color-scheme: dark) { html { background: #0b1310; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Atlas needs JavaScript to run.</noscript>
    <script>
      // Last-resort recovery. If the app bundle can't load (for example a damaged offline cache),
      // switch to any newer downloaded version and reload once. Never loops, never touches user
      // data (that lives in IndexedDB, not in these caches).
      (function () {
        var KEY = 'atlas:boot-retry';
        function showHelp() {
          var app = document.getElementById('app');
          if (!app) return;
          app.innerHTML =
            '<div style="font-family:system-ui,-apple-system,sans-serif;max-width:420px;margin:0 auto;padding:96px 24px;text-align:center">' +
            '<p style="font-size:20px;font-weight:700;margin:0 0 8px">Atlas couldn’t start</p>' +
            '<p style="opacity:.7;margin:0 0 24px;line-height:1.5">Your data is safe. Connect to the internet once so Atlas can repair itself.</p>' +
            '<button id="atlas-repair" style="font:inherit;font-weight:600;padding:14px 22px;border:0;border-radius:14px;background:#2e4bdb;color:#fff">Repair and reload</button></div>';
          document.getElementById('atlas-repair').onclick = function () {
            var done = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} location.reload(); };
            if (!('serviceWorker' in navigator)) return done();
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).then(function () {
              return window.caches ? caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (k) { return k.indexOf('atlas-') === 0; }).map(function (k) { return caches.delete(k); }));
              }) : null;
            }).then(done, done);
          };
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (!target || target.tagName !== 'SCRIPT') return;
          var retried = false;
          try { retried = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); } catch (e) { retried = true; }
          if (retried || !('serviceWorker' in navigator)) return showHelp();
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            setTimeout(function () { location.reload(); }, 400);
          }, showHelp);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
